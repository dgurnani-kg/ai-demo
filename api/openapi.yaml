openapi: 3.0.3
info:
  title: Library Service API
  version: 1.3.0
  description: |
    The contract between the Spring backend and the React client.

    This file is the source of truth. It is edited by exactly one procedure
    (.claude/skills/api-contract-change) and is read-only to every
    implementation agent. If the code and this file disagree, the code is wrong.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: catalog
  - name: membership
  - name: lending

paths:
  /api/books:
    get:
      tags: [catalog]
      summary: List books in the catalogue
      operationId: listBooks
      parameters:
        - name: available
          in: query
          required: false
          description: When true, only books with at least one copy on the shelf
          schema:
            type: boolean
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"

  /api/books/{bookId}:
    get:
      tags: [catalog]
      summary: Fetch a single book
      operationId: getBook
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books/{bookId}/reservations:
    post:
      tags: [lending]
      summary: Reserve a book that has no copies on the shelf
      description: |
        Joins the waiting queue for a title that is fully out on loan. When a copy comes
        back the oldest waiting reservation becomes READY and that copy is held for the
        member until they collect it.
      operationId: placeReservation
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationRequest"
      responses:
        "201":
          description: The reservation that was placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/members:
    get:
      tags: [membership]
      summary: List members
      operationId: listMembers
      responses:
        "200":
          description: All members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"

  /api/loans:
    get:
      tags: [lending]
      summary: List loans
      operationId: listLoans
      parameters:
        - name: memberId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Loans, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      tags: [lending]
      summary: Borrow a copy of a book
      operationId: borrowBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowRequest"
      responses:
        "201":
          description: The loan that was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/loans/{loanId}/return:
    post:
      tags: [lending]
      summary: Return a borrowed copy
      operationId: returnLoan
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The closed loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/reservations:
    get:
      tags: [lending]
      summary: List reservations, newest first
      operationId: listReservations
      parameters:
        - name: memberId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: When given, only reservations in that state
          schema:
            $ref: "#/components/schemas/ReservationStatus"
      responses:
        "200":
          description: Reservations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  /api/reservations/{reservationId}/cancel:
    post:
      tags: [lending]
      summary: Give up a place in the queue
      operationId: cancelReservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The cancelled reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    Book:
      type: object
      additionalProperties: false
      required: [id, isbn, title, author, totalCopies, availableCopies]
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
          example: "978-0132350884"
        title:
          type: string
        author:
          type: string
        totalCopies:
          type: integer
          minimum: 0
        availableCopies:
          type: integer
          minimum: 0

    Member:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email

    Loan:
      type: object
      additionalProperties: false
      required: [id, bookId, bookTitle, memberId, memberName, borrowedAt, dueAt]
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookTitle:
          type: string
        memberId:
          type: integer
          format: int64
        memberName:
          type: string
        borrowedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          format: date-time
          nullable: true

    BorrowRequest:
      type: object
      additionalProperties: false
      required: [bookId, memberId]
      properties:
        bookId:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64

    ReservationStatus:
      type: string
      description: |
        WAITING   - in the queue, no copy held yet.
        READY     - a copy has come back and is held for this member.
        COLLECTED - the member borrowed the copy that was held.
        CANCELLED - the member gave up their place.
      enum: [WAITING, READY, COLLECTED, CANCELLED]

    Reservation:
      type: object
      additionalProperties: false
      required: [id, bookId, bookTitle, memberId, memberName, status, reservedAt]
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookTitle:
          type: string
        memberId:
          type: integer
          format: int64
        memberName:
          type: string
        status:
          $ref: "#/components/schemas/ReservationStatus"
        reservedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true

    ReservationRequest:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId:
          type: integer
          format: int64

    ApiError:
      type: object
      additionalProperties: false
      required: [status, error, message]
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
